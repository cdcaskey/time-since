# No reverse proxy or auth — deployment responsibility, not app's.
services:
  app:
    image: ghcr.io/cdcaskey/time-since:latest
    container_name: time-since
    restart: unless-stopped

    environment:
      PUID: '1000'
      PGID: '1000'
      DATA_DIR: /data
      CONFIG_DIR: /config

    volumes:
      # Mount the whole dir, not just time-since.db — SQLite's WAL mode
      # adds time-since.db-wal and time-since.db-shm alongside it.
      - ./data:/data
      - ./config:/config

    ports:
      - '3000:3000'

    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
